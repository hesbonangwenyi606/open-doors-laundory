    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Open Doors Laundromat",
        "description": "Professional garment care services including wash & fold, dry cleaning, ironing, and pickup & delivery in Kitengela and surrounding areas.",

    <script>
      (function() {
        var stored = localStorage.getItem('od-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
